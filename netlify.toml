# Static site — no build step. Deploys the repo root as-is.
# Serverless: /api/* (REST + OpenAPI) and /mcp (Model Context Protocol).
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
